<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 440" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#131c31"/>
    </linearGradient>
  </defs>
  <rect width="1100" height="440" rx="18" fill="url(#bg3)"/>
  <text x="55" y="58" font-size="28" font-weight="700" fill="#f8fafc">Three Levels of AI Ambition</text>
  <text x="55" y="86" font-size="14" fill="#94a3b8">each level builds on the one before — and each is harder for competitors to copy</text>

  <!-- ascending arrow -->
  <line x1="80" y1="360" x2="990" y2="150" stroke="#334155" stroke-width="2.5" stroke-dasharray="7 6"/>

  <!-- Level 1 -->
  <g>
    <rect x="65" y="250" width="300" height="140" rx="14" fill="#1e293b"/>
    <rect x="65" y="250" width="300" height="7" rx="3.5" fill="#38bdf8"/>
    <text x="85" y="288" font-size="13" font-weight="700" fill="#38bdf8" letter-spacing="1.5">LEVEL 1</text>
    <text x="85" y="315" font-size="21" font-weight="800" fill="#f8fafc">Efficiency</text>
    <text x="85" y="341" font-size="13" fill="#cbd5e1">Same work, cheaper and faster:</text>
    <text x="85" y="359" font-size="13" fill="#94a3b8">drafts, summaries, routine answers.</text>
    <text x="85" y="380" font-size="12.5" font-style="italic" fill="#64748b">Where everyone starts — and most stall.</text>
  </g>

  <!-- Level 2 -->
  <g>
    <rect x="400" y="190" width="300" height="140" rx="14" fill="#1e293b"/>
    <rect x="400" y="190" width="300" height="7" rx="3.5" fill="#a78bfa"/>
    <text x="420" y="228" font-size="13" font-weight="700" fill="#a78bfa" letter-spacing="1.5">LEVEL 2</text>
    <text x="420" y="255" font-size="21" font-weight="800" fill="#f8fafc">Augmentation</text>
    <text x="420" y="281" font-size="13" fill="#cbd5e1">Better work, better decisions:</text>
    <text x="420" y="299" font-size="13" fill="#94a3b8">AI combined with YOUR data and expertise.</text>
    <text x="420" y="320" font-size="12.5" font-style="italic" fill="#64748b">Much harder for competitors to copy.</text>
  </g>

  <!-- Level 3 -->
  <g>
    <rect x="735" y="130" width="300" height="140" rx="14" fill="#1e293b"/>
    <rect x="735" y="130" width="300" height="7" rx="3.5" fill="#34d399"/>
    <text x="755" y="168" font-size="13" font-weight="700" fill="#34d399" letter-spacing="1.5">LEVEL 3</text>
    <text x="755" y="195" font-size="21" font-weight="800" fill="#f8fafc">Transformation</text>
    <text x="755" y="221" font-size="13" fill="#cbd5e1">New products, services and</text>
    <text x="755" y="239" font-size="13" fill="#94a3b8">business models not possible before AI.</text>
    <text x="755" y="260" font-size="12.5" font-style="italic" fill="#64748b">Changes your competitive position.</text>
  </g>

  <text x="550" y="422" font-size="12" fill="#64748b" text-anchor="middle">An honest AI strategy names the level you are pursuing — and why.</text>
</svg>
